  function comparativoParalelaOficial(st) {
    var subs = state.fiscais;
    var somaCand = 0, somaPartido = 0, n = 0;
    subs.forEach(function (f) {
      var vc = Number(f.votosCandidato) || 0, vp = Number(f.votosPartido) || 0;
      if (vp > 0) { somaCand += vc; somaPartido += vp; n++; }
    });
    if (n < MIN_SECOES_PARA_COMPARATIVO || somaPartido <= 0) return { disponivel: false, secoesUsadas: n };
    if (st.kind !== 'com-dados' || !st.nosso || !st.linhaPartido || !st.linhaPartido.votos) return { disponivel: false, secoesUsadas: n };
    var shareParalela = somaCand / somaPartido;
    var shareOficial = st.nosso.votos / st.linhaPartido.votos;
    var diffPontos = (shareParalela - shareOficial) * 100;
    var classe = Math.abs(diffPontos) < 5 ? 'ok' : (Math.abs(diffPontos) < 10 ? 'warn' : 'danger');
    return { disponivel: true, secoesUsadas: n, shareParalela: shareParalela, shareOficial: shareOficial, diffPontos: diffPontos, classe: classe };
  }

  /* ---------------- cobertura de fiscais por zona esperada ---------------- */
  function chaveMunicipioZona(m, z) { return (m || '').trim().toLowerCase() + '|' + (z || '').trim().toLowerCase(); }
  function coberturaPorZona() {
    var esperadas = state.config.zonasEsperadas || [];
    if (!esperadas.length) return null;
    var reportadas = {};
    state.fiscais.forEach(function (f) {
      var k = chaveMunicipioZona(f.municipio, f.zona);
      reportadas[k] = (reportadas[k] || 0) + 1;
    });
    var cobertas = [], faltando = [];
    esperadas.forEach(function (e) {
      var k = chaveMunicipioZona(e.municipio, e.zona);
      (reportadas[k] ? cobertas : faltando).push(e);
    });
    return { total: esperadas.length, cobertas: cobertas, faltando: faltando };
  }
  function parseZonasEsperadas(texto) {
    return (texto || '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean).map(function (linha) {
      var partes = parseCsvLine(linha);
      return { municipio: (partes[0] || '').trim(), zona: (partes[1] || '').trim() };
    }).filter(function (e) { return e.municipio; });
  }

  /* ---------------- classificação do marco atual (usada no chip, no alerta e no histórico) ---------------- */
  function classificarStatus(st) {
    if (st.kind === 'sem-dados') return { chave: 'sem-dados', label: 'Aguardando dados oficiais', classe: 'neutral' };
    if (!st.nosso) return { chave: 'sem-candidato', label: 'Cadastre seu candidato na aba Projeção', classe: 'neutral' };
    if (st.nosso.eleito) return { chave: 'eleito', label: 'Projeção: ELEITO', classe: 'ok' };
    if (st.nosso.passaClausula) return { chave: 'fora-faixa', label: 'Projeção: fora da faixa de vagas', classe: 'warn' };
    return { chave: 'abaixo-clausula', label: 'Projeção: abaixo da cláusula de desempenho', classe: 'danger' };
  }

  /* ================= gráficos (SVG) ================= */
  var COR_DEEMPH = 'color-mix(in srgb, var(--ink) 20%, transparent)';
  var COR_DEEMPH_2 = 'color-mix(in srgb, var(--ink) 34%, transparent)';
  var COR_DEEMPH_3 = 'color-mix(in srgb, var(--ink) 48%, transparent)';
  var COR_DEEMPH_4 = 'color-mix(in srgb, var(--ink) 62%, transparent)';
  function truncar(s, n) { s = s || ''; return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function classeParaCorStatus(classe) {
    return classe === 'ok' ? 'var(--ok)' : classe === 'warn' ? 'var(--warn)' : classe === 'danger' ? 'var(--danger)' : 'var(--ink-faint)';
  }

  /* --- gráfico 1: vagas projetadas por partido (barras horizontais, emphasis) --- */
  function chartVagasPorPartido() {
    var dist = distribuicaoAtual();
    var linhas = dist.resultado.filter(function (r) { return r.votos > 0; });
    if (!linhas.length) return '<div class="chart-empty">Lance os votos por partido na aba Apuração Oficial para ver este gráfico.</div>';
    var nomePartido = (state.config.partido || '').trim().toLowerCase();
    var max = Math.max(1, linhas.reduce(function (m, r) { return Math.max(m, r.vagasTotal); }, 0));
    var rowH = 26, gap = 6, labelW = 168, W = 560, chartAreaW = W - labelW - 46;
    var H = linhas.length * (rowH + gap) - gap + 8;
    var rows = linhas.map(function (r, i) {
      var y = i * (rowH + gap);
      var isNosso = r.nome.toLowerCase() === nomePartido;
      var w = Math.max(2, (r.vagasTotal / max) * chartAreaW);
      var cor = isNosso ? 'var(--accent)' : COR_DEEMPH_2;
      return '' +
        '<text x="' + (labelW - 10) + '" y="' + (y + rowH / 2 + 4) + '" text-anchor="end" font-size="11.5" font-weight="' + (isNosso ? '700' : '500') + '"' + (isNosso ? '' : ' class="lbl-muted"') + '>' + esc(truncar(r.nome, 24)) + '</text>' +
        '<rect x="' + labelW + '" y="' + y + '" width="' + w + '" height="' + rowH + '" rx="4" fill="' + cor + '"><title>' + esc(r.nome) + ': ' + r.vagasTotal + ' vaga(s) — ' + fmt(r.votos) + ' votos</title></rect>' +
        '<text x="' + (labelW + w + 8) + '" y="' + (y + rowH / 2 + 4) + '" font-size="12" font-weight="700" font-family="IBM Plex Mono, monospace">' + r.vagasTotal + '</text>';
    }).join('');
    return '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Vagas projetadas por partido">' + rows + '</svg>';
  }

  /* --- gráfico 2: distribuição dos votos válidos (rosca, top partido + 4 maiores + outros) --- */
  function chartDistribuicaoVotos() {
    var total = votosValidosTotais();
    if (!total || !state.oficial.length) return '<div class="chart-empty">Lance os votos por partido na aba Apuração Oficial para ver este gráfico.</div>';
    var nomePartido = (state.config.partido || '').trim().toLowerCase();
    var ordenado = state.oficial.slice().filter(function (p) { return Number(p.votos) > 0; }).sort(function (a, b) { return b.votos - a.votos; });
    var nosso = ordenado.filter(function (p) { return p.nome.toLowerCase() === nomePartido; });
    var outrosOrdenados = ordenado.filter(function (p) { return p.nome.toLowerCase() !== nomePartido; });
    var top4 = outrosOrdenados.slice(0, 4);
    var restoSoma = outrosOrdenados.slice(4).reduce(function (s, p) { return s + Number(p.votos); }, 0);
    var somaLancada = ordenado.reduce(function (s, p) { return s + Number(p.votos); }, 0);
    var naoLancado = Math.max(0, total - somaLancada);
    var fatias = [];
    if (nosso.length) fatias.push({ nome: nosso[0].nome, votos: Number(nosso[0].votos), cor: 'var(--accent)', destaque: true });
    var cores = [COR_DEEMPH, COR_DEEMPH_2, COR_DEEMPH_3, COR_DEEMPH_4];
    top4.forEach(function (p, i) { fatias.push({ nome: p.nome, votos: Number(p.votos), cor: cores[i] || COR_DEEMPH_4 }); });
    if (restoSoma + naoLancado > 0) fatias.push({ nome: naoLancado > 0 ? 'Outros / ainda não lançado' : 'Outros', votos: restoSoma + naoLancado, cor: 'var(--panel-2)', outros: true });
    if (!fatias.length) return '<div class="chart-empty">Sem votos lançados ainda.</div>';

    var cx = 90, cy = 90, r = 66, strokeW = 26, circunf = 2 * Math.PI * r;
    var acumulado = 0;
    var arcos = fatias.map(function (f) {
      var frac = f.votos / total;
      var comprimento = Math.max(0.4, frac * circunf - 1.5); // -1.5 = respiro entre fatias (surface gap)
      var offset = circunf - acumulado * circunf;
      acumulado += frac;
      return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + f.cor + '" stroke-width="' + strokeW + '"' +
        ' stroke-dasharray="' + comprimento + ' ' + circunf + '" stroke-dashoffset="' + offset + '" transform="rotate(-90 ' + cx + ' ' + cy + ')">' +
        '<title>' + esc(f.nome) + ': ' + pct(frac) + ' (' + fmt(f.votos) + ' votos)</title></circle>';
    }).join('');
    var pctNosso = nosso.length ? nosso[0].votos / total : 0;
    var centro = nosso.length
      ? '<text x="' + cx + '" y="' + (cy - 3) + '" text-anchor="middle" font-size="20" font-weight="700" fill="var(--accent)">' + pct(pctNosso) + '</text><text x="' + cx + '" y="' + (cy + 15) + '" text-anchor="middle" font-size="10" class="lbl-muted">' + esc(truncar(state.config.partido, 14)) + '</text>'
      : '<text x="' + cx + '" y="' + cy + '" text-anchor="middle" font-size="12" class="lbl-muted">votos válidos</text>';
    var svg = '<svg class="chart-svg" viewBox="0 0 180 180" role="img" aria-label="Distribuição dos votos válidos" style="max-width:220px; margin:0 auto;">' + arcos + centro + '</svg>';
    var legenda = '<div class="chart-legend">' + fatias.map(function (f) {
      return '<span class="item"><span class="swatch" style="background:' + f.cor + ';"></span>' + esc(truncar(f.nome, 26)) + ' — ' + pct(f.votos / total) + '</span>';
    }).join('') + '</div>';
    return svg + legenda;
  }

  /* --- gráfico 3: medidor do candidato (meter, cor por severidade) --- */
  function chartMeterCandidato(st) {
    if (st.kind !== 'com-dados' || !st.nosso) return '<div class="chart-empty">Cadastre seu candidato para ver o medidor.</div>';
    var QE = st.QE, votos = st.nosso.votos;
    var pctQE = QE > 0 ? votos / QE : 0;
    var fillPct = Math.max(0, Math.min(100, pctQE * 100));
    var minPct = 10; // cláusula de desempenho
    var cor = classeParaCorStatus(classificarStatus(st).classe);
    var W = 560, H = 54, trackH = 22, y = 16, labelPct = pctQE >= 1 ? 100 : Math.max(6, fillPct);
    return '' +
      '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Medidor do candidato em relação ao quociente eleitoral">' +
        '<rect x="0" y="' + y + '" width="' + W + '" height="' + trackH + '" rx="11" fill="var(--panel-2)"></rect>' +
        '<rect x="0" y="' + y + '" width="' + (fillPct / 100 * W) + '" height="' + trackH + '" rx="11" fill="' + cor + '"><title>' + fmt(votos) + ' votos — ' + pct(pctQE) + ' do QE</title></rect>' +
        '<line x1="' + (minPct / 100 * W) + '" y1="' + (y - 4) + '" x2="' + (minPct / 100 * W) + '" y2="' + (y + trackH + 4) + '" stroke="var(--ink)" stroke-width="2" opacity="0.55"></line>' +
        '<text x="' + (minPct / 100 * W) + '" y="' + (y - 8) + '" text-anchor="middle" font-size="11" font-weight="600">10% (mínimo)</text>' +
        '<text x="' + (Math.min(96, Math.max(4, fillPct)) / 100 * W) + '" y="' + (y + trackH + 20) + '" text-anchor="' + (fillPct > 90 ? 'end' : 'middle') + '" font-size="12" font-weight="700" font-family="IBM Plex Mono, monospace" fill="' + cor + '">' + pct(pctQE) + '</text>' +
      '</svg>';
  }

  /* --- gráfico 4: evolução do candidato ao longo da apuração (linha) --- */
  function chartEvolucao() {
    var pontos = (state.historico.pontos || []).filter(function (p) { return p.candidatoPctQE !== null && p.candidatoPctQE !== undefined; });
    if (pontos.length < 2) {
      return '<div class="chart-empty">Ainda não há histórico suficiente. A linha do tempo é registrada automaticamente conforme os dados oficiais são atualizados — ou use "Registrar snapshot agora" na aba Apuração Oficial.</div>';
    }
    var W = 620, H = 200, padL = 40, padR = 16, padT = 16, padB = 26;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var valores = pontos.map(function (p) { return p.candidatoPctQE * 100; });
    var maxV = Math.max(110, Math.max.apply(null, valores) * 1.12);
    function xAt(i) { return padL + (i / (pontos.length - 1)) * plotW; }
    function yAt(v) { return padT + plotH - (v / maxV) * plotH; }
    function refLine(v, label) {
      var y = yAt(v);
      if (y < padT - 2 || y > padT + plotH + 2) return '';
      return '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '" stroke="var(--border)" stroke-width="1"></line>' +
        '<text x="' + (padL + plotW) + '" y="' + (y - 4) + '" text-anchor="end" font-size="10" class="lbl-muted">' + label + '</text>';
    }
    var pathD = pontos.map(function (p, i) { return (i === 0 ? 'M' : 'L') + xAt(i).toFixed(1) + ' ' + yAt(p.candidatoPctQE * 100).toFixed(1); }).join(' ');
    var pontosSvg = pontos.map(function (p, i) {
      var x = xAt(i), y = yAt(p.candidatoPctQE * 100);
      var hora = fmtWhen(p.t);
      return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"><title>' + hora + ' — ' + pct(p.candidatoPctQE) + ' do QE (' + fmt(p.candidatoVotos) + ' votos)</title></circle>';
    }).join('');
    var ultimo = pontos[pontos.length - 1];
    var labelFinal = '<text x="' + xAt(pontos.length - 1).toFixed(1) + '" y="' + (yAt(ultimo.candidatoPctQE * 100) - 10).toFixed(1) + '" text-anchor="end" font-size="12" font-weight="700" fill="var(--accent)">' + pct(ultimo.candidatoPctQE) + '</text>';
    var eixoX = '<text x="' + padL + '" y="' + (H - 6) + '" font-size="10" class="lbl-muted">' + fmtWhen(pontos[0].t) + '</text>' +
      '<text x="' + (padL + plotW) + '" y="' + (H - 6) + '" text-anchor="end" font-size="10" class="lbl-muted">' + fmtWhen(ultimo.t) + '</text>';
    return '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evolução do candidato ao longo da apuração">' +
      refLine(10, '10% (cláusula)') + refLine(100, '100% (QE)') +
      '<path d="' + pathD + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>' +
      pontosSvg + labelFinal + eixoX +
      '</svg>';
  }

  /* --- gráfico 5/6: ranking de votos por município e por zona (apuração paralela, fiscais) --- */
  function _barrasRankingSvg(itens, corCss, ariaLabel) {
    var TOP_N = 15;
    var lista = itens.slice(0, TOP_N);
    var max = Math.max(1, lista.reduce(function (m, it) { return Math.max(m, it.valor); }, 0));
    var rowH = 24, gap = 6, labelW = 148, W = 560, chartAreaW = W - labelW - 50;
    var H = lista.length * (rowH + gap) - gap + 8;
    var rows = lista.map(function (it, i) {
      var y = i * (rowH + gap);
      var w = Math.max(2, (it.valor / max) * chartAreaW);
      return '' +
        '<text x="' + (labelW - 10) + '" y="' + (y + rowH / 2 + 4) + '" text-anchor="end" font-size="11.5" font-weight="500" class="lbl-muted">' + esc(truncar(it.label, 20)) + '</text>' +
        '<rect x="' + labelW + '" y="' + y + '" width="' + w + '" height="' + rowH + '" rx="4" fill="' + corCss + '"><title>' + esc(it.tooltip) + '</title></rect>' +
        '<text x="' + (labelW + w + 8) + '" y="' + (y + rowH / 2 + 4) + '" font-size="12" font-weight="700" font-family="IBM Plex Mono, monospace">' + fmt(it.valor) + '</text>';
    }).join('');
    var svg = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(ariaLabel) + '">' + rows + '</svg>';
    var nota = itens.length > TOP_N
      ? '<div class="hint">mostrando os ' + TOP_N + ' primeiros de ' + itens.length + ' — veja a tabela completa abaixo</div>' : '';
    return svg + nota;
  }
  function chartVotosPorMunicipio(porMunicipio, municipiosOrdenados) {
    if (!municipiosOrdenados.length) return '<div class="chart-empty">Registre boletins de seção com o município preenchido para ver este ranking.</div>';
    var itens = municipiosOrdenados.map(function (nome) {
      var d = porMunicipio[nome];
      return { label: nome, valor: d.votosCandidato, tooltip: nome + ': ' + fmt(d.votosCandidato) + ' votos do candidato em ' + d.secoes + ' seção(ões) reportada(s)' };
    });
    return _barrasRankingSvg(itens, 'var(--accent-2)', 'Ranking de votos do candidato por município');
  }
  function chartVotosPorZona(porZona, zonasOrdenadas) {
    if (!zonasOrdenadas.length) return '<div class="chart-empty">Registre boletins de seção com o município e a zona preenchidos para ver este ranking.</div>';
    var itens = zonasOrdenadas.map(function (k) {
      var d = porZona[k];
      return { label: k, valor: d.votosCandidato, tooltip: k + ': ' + fmt(d.votosCandidato) + ' votos do candidato em ' + d.secoes + ' seção(ões) reportada(s)' };
    });
    return _barrasRankingSvg(itens, 'var(--accent-3)', 'Ranking de votos do candidato por zona eleitoral');
  }

  /* ---------------- render: barra de status ---------------- */
  function renderStatusChip() {
    var wrap = document.getElementById('status-chip-wrap');
    var st = statusCandidato();
    var c = classificarStatus(st);
    var flash = marcoFlashAtivo ? ' <span class="pill warn" style="margin-left:6px; animation:pulse 1.6s ease-in-out infinite;">mudou agora</span>' : '';
    wrap.innerHTML = !state.dbAvailable
      ? '<span class="status-chip neutral"><span class="dot"></span>Conectando…</span>'
      : '<span class="status-chip ' + c.classe + '"><span class="dot"></span>' + c.label + '</span>' + flash;
  }

  /* ---------------- modo telão / apresentação ---------------- */
  function abrirTelao() { modoTelaoAtivo = true; document.body.style.overflow = 'hidden'; renderTelaoOverlay(); }
  function fecharTelao() { modoTelaoAtivo = false; document.body.style.overflow = ''; renderTelaoOverlay(); }
  function toggleTelao() { if (modoTelaoAtivo) fecharTelao(); else abrirTelao(); }
  function renderTelaoOverlay() {
    var root = document.getElementById('telao-root');
    if (!root) return;
    root.innerHTML = modoTelaoAtivo ? renderTelao() : '';
    if (modoTelaoAtivo) {
      var btn = document.getElementById('btn-telao-fechar');
      if (btn) btn.addEventListener('click', fecharTelao);
    }
  }
  function renderTelao() {
    var st = statusCandidato();
    var c = classificarStatus(st);
    var numero = state.config.candidatoNumero || '—';
    var nome = state.config.candidato || 'Candidato';
    var partido = state.config.partido || '';
    var metrics = '';
    if (st.kind === 'com-dados' && st.nosso) {
      metrics =
        '<div class="telao-metrics">' +
          '<div><div class="value mono">' + fmt(st.nosso.votos) + '</div><div class="label">Votos nominais</div></div>' +
          '<div><div class="value mono">' + pct(st.QE > 0 ? st.nosso.votos / st.QE : 0) + '</div><div class="label">% do quociente eleitoral</div></div>' +
          '<div><div class="value mono">' + fmt(st.vagasDoPartido) + '</div><div class="label">Vagas projetadas · ' + esc(truncar(partido, 18)) + '</div></div>' +
        '</div>' +
        '<div class="telao-meter-wrap">' + chartMeterCandidato(st) + '</div>';
    } else {
      metrics = '<div class="banner" style="max-width:640px;">Aguardando dados oficiais e cadastro do candidato para calcular a projeção.</div>';
    }
    return '' +
      '<div class="telao">' +
        '<button class="btn ghost telao-close" id="btn-telao-fechar" type="button">✕ Fechar (Esc)</button>' +
        '<div class="telao-numero mono">' + esc(numero) + '</div>' +
        '<div class="telao-nome">' + esc(nome) + '</div>' +
        '<div class="telao-partido">' + esc(partido) + ' · Deputado Estadual · Espírito Santo · 2026</div>' +
        '<span class="status-chip ' + c.classe + ' telao-chip"><span class="dot"></span>' + c.label + '</span>' +
        metrics +
      '</div>';
  }

  /* ---------------- tabs ---------------- */
  var TABS = [
    { id: 'oficial', label: 'Apuração Oficial' },
    { id: 'projecao', label: 'Projeção de Vagas' },
    { id: 'fiscais', label: 'Apuração Paralela' },
    { id: 'candidatos', label: 'Candidatos (TSE)' },
    { id: 'config', label: 'Configuração' },
    { id: 'metodologia', label: 'Metodologia' },
  ];
  function renderTabs() {
    var el = document.getElementById('tabs');
    el.innerHTML = TABS.map(function (t) {
      return '<button class="tab-btn' + (activeTab === t.id ? ' active' : '') + '" data-tab="' + t.id + '" role="tab">' + t.label + '</button>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.tab-btn'), function (btn) {
      btn.addEventListener('click', function () { activeTab = btn.getAttribute('data-tab'); renderAll(); });
    });
  }

  /* ---------------- render principal ---------------- */
  // renderAll() reconstrói a página inteira a partir do zero (main.innerHTML = ...), o que
  // apaga qualquer coisa digitada num campo de texto naquele instante. A correção principal
  // é notificarTodos() só avisar quando algo de fato mudou (menos re-renders no total), mas
  // como rede de segurança extra: se a pessoa estiver com o cursor num campo de texto/área de
  // texto quando um render for pedido (por exemplo, uma mudança feita por outro fiscal ao
  // mesmo tempo), adiamos o render até ela sair do campo, em vez de apagar o que ela digitou.
  var renderPendente = false;
  function ehCampoDeTexto(el) {
    if (!el) return false;
    if (el.tagName === 'TEXTAREA') return true;
    if (el.tagName === 'INPUT') {
      var tipo = (el.type || 'text').toLowerCase();
      return ['text', 'number', 'search', 'email', 'tel', 'url', 'password'].indexOf(tipo) !== -1;
    }
    return false;
  }
  function renderAll() {
    if (ehCampoDeTexto(document.activeElement)) { renderPendente = true; return; }
    renderPendente = false;
    renderAllAgora();
  }
  document.addEventListener('focusout', function () {
    setTimeout(function () {
      if (renderPendente && !ehCampoDeTexto(document.activeElement)) {
        renderPendente = false;
        renderAllAgora();
      }
    }, 50);
  });
  function renderAllAgora() {
    renderTabs();
    renderStatusChip();
    var main = document.getElementById('main');
    var viewHtml = '';
    if (activeTab === 'oficial') viewHtml = viewOficial();
    else if (activeTab === 'projecao') viewHtml = viewProjecao();
    else if (activeTab === 'fiscais') viewHtml = viewFiscais();
    else if (activeTab === 'candidatos') viewHtml = viewCandidatosTse();
    else if (activeTab === 'config') viewHtml = viewConfig();
    else viewHtml = viewMetodologia();
    main.innerHTML = renderMarcoBanner() + viewHtml;
    wireEvents();
    document.getElementById('brand-sub').textContent =
      (state.config.candidato ? state.config.candidato + ' · ' : '') + 'Deputado Estadual · Espírito Santo · 2026';
    renderTelaoOverlay();
  }

  /* ---------------- banner de alerta de marco (visível em qualquer aba) ---------------- */
  function renderMarcoBanner() {
    if (!marcoFlashAtivo) return '';
    return '<div class="banner alerta"><span>🔔</span><div><b>Mudança de status agora:</b> ' + esc(LABEL_MARCO[marcoFlashAtivo] || marcoFlashAtivo) +
      ' — veja a aba <b>Projeção de Vagas</b> para os detalhes.</div></div>';
  }

  /* ---------------- view: Apuração Oficial ---------------- */
  function cardBuscarTSE() {
    var corpo;
    if (tseState.preview) {
      var p = tseState.preview;
      var linhasPart = (p.partidos || []).slice().sort(function (a, b) { return b.votos - a.votos; }).map(function (row) {
        return '<tr><td>' + esc(row.sigla) + '</td><td class="num">' + fmt(row.votos) + '</td></tr>';
      }).join('');
      var linhasCand = (p.candidatos || []).slice().sort(function (a, b) { return b.votos - a.votos; }).slice(0, 15).map(function (row) {
        return '<tr><td class="mono">' + esc(row.numero) + '</td><td>' + esc(row.nome) + '</td><td>' + esc(row.partido) + '</td><td class="num">' + fmt(row.votos) + '</td><td style="color:var(--ink-faint); font-size:11.5px;">' + esc(row.situacao || '') + '</td></tr>';
      }).join('');
      corpo =
        '<div class="banner"><span>👀</span><div>Prévia do que o TSE está publicando agora' + (p.secoesTotalizadas ? ' (' + esc(p.secoesTotalizadas) + ' seções totalizadas)' : '') + '. Confira os números antes de aplicar — nada foi salvo ainda.</div></div>' +
        (linhasPart ? '<div class="table-wrap"><table><thead><tr><th>Partido/federação</th><th class="num">Votos</th></tr></thead><tbody>' + linhasPart + '</tbody></table></div>' : '') +
        (linhasCand ? '<div class="table-wrap" style="margin-top:10px;"><table><thead><tr><th>Nº</th><th>Candidato</th><th>Partido</th><th class="num">Votos</th><th>Situação</th></tr></thead><tbody>' + linhasCand + '</tbody></table><p class="hint" style="margin-top:6px;">mostrando os 15 mais votados; todos são aplicados ao confirmar</p></div>' : '') +
        '<div style="display:flex; gap:8px; margin-top:12px;">' +
          '<button class="btn primary" id="btn-aplicar-tse">Aplicar ' + fmt((p.partidos || []).length) + ' partido(s) e ' + fmt((p.candidatos || []).length) + ' candidato(s)</button>' +
          '<button class="btn ghost" id="btn-descartar-tse">Descartar</button>' +
        '</div>';
    } else {
      corpo =
        (tseState.erro ? '<div class="banner warn"><span>⚠️</span><div>Não foi possível buscar: ' + esc(tseState.erro) + '</div></div>' : '') +
        '<p class="hint" style="margin:0 0 10px;">Busca os votos de Deputado Estadual do ES direto do arquivo oficial publicado pelo TSE e mostra uma prévia — nada é salvo sem você confirmar.</p>' +
        '<button class="btn primary" id="btn-atualizar-tse"' + (tseState.carregando ? ' disabled' : '') + '>' + (tseState.carregando ? 'Buscando…' : '🔄 Atualizar do TSE') + '</button>';
    }
    return '<div class="card"><div class="card-head"><h2>Buscar direto do TSE</h2><span class="hint">preenchimento automático, opcional</span></div>' + corpo + '</div>';
  }

  function viewOficial() {
    var totalValidos = votosValidosTotais();
    var somaPartidos = state.oficial.reduce(function (s, p) { return s + (Number(p.votos) || 0); }, 0);
    var usandoOverride = state.config.votosValidosOverride !== null && state.config.votosValidosOverride !== undefined && state.config.votosValidosOverride !== '';
    var linhas = state.oficial.slice().sort(function (a, b) { return (Number(b.votos) || 0) - (Number(a.votos) || 0); });

    var rowsHtml = linhas.length ? linhas.map(function (p) {
      var isNosso = (state.config.partido || '').trim().toLowerCase() === (p.nome || '').trim().toLowerCase();
      return '<tr class="' + (isNosso ? 'row-highlight' : '') + '">' +
        '<td>' + esc(p.nome) + (isNosso ? ' <span class="pill brand">seu partido</span>' : '') + '</td>' +
        '<td class="num">' + fmt(p.votos) + '</td>' +
        '<td class="num" style="color:var(--ink-faint); font-size:11.5px;">' + fmtWhen(p.atualizadoEm) + '</td>' +
        '<td><button class="btn small ghost" data-del-oficial="' + esc(p.id) + '">remover</button></td>' +
        '</tr>';
    }).join('') : '<tr><td colspan="4" class="empty">Nenhum partido/federação lançado ainda.</td></tr>';

    return '' +
      '<div class="grid cols-3">' +
        '<div class="card"><div class="eyebrow">Votos válidos (estado)</div><div class="metric"><div class="value mono" style="color:var(--accent);">' + fmt(totalValidos) + '</div><div class="label">' + (usandoOverride ? 'valor definido manualmente' : 'soma dos partidos lançados abaixo') + '</div></div></div>' +
        '<div class="card"><div class="eyebrow">Vagas na ALES</div><div class="metric"><div class="value mono" style="color:var(--accent-3);">' + fmt(state.config.vagas || VAGAS_ALES) + '</div><div class="label">assembleia legislativa do ES</div></div></div>' +
        '<div class="card"><div class="eyebrow">Quociente eleitoral (QE)</div><div class="metric"><div class="value mono" style="color:var(--accent-2);">' + fmt(distribuicaoAtual().QE) + '</div><div class="label">votos válidos ÷ vagas</div></div></div>' +
      '</div>' +

      cardBuscarTSE() +

      '<div class="card">' +
        '<div class="card-head"><h2>Votos por partido / federação</h2><div style="display:flex; align-items:center; gap:12px;"><span class="hint">lançado manualmente a partir do TSE/TRE-ES</span><button class="btn small ghost" id="btn-snapshot-agora" type="button" title="Salva um ponto na linha do tempo com os números de agora">📌 Registrar snapshot agora</button></div></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Partido ou federação</th><th class="num">Votos (legenda)</th><th class="num">Atualizado</th><th></th></tr></thead>' +
        '<tbody>' + rowsHtml + '</tbody></table></div>' +
      '</div>' +

      '<div class="grid cols-2">' +
        '<div class="card">' +
          '<div class="card-head"><h2>Lançar / atualizar um partido</h2></div>' +
          '<div class="field"><label for="of-nome">Partido ou federação</label><input type="text" id="of-nome" placeholder="Ex: PL, UNIÃO, FEDERAÇÃO PSOL-REDE"></div>' +
          '<div class="field"><label for="of-votos">Votos de legenda (total do partido)</label><input type="number" id="of-votos" min="0" step="1" placeholder="Ex: 182340"></div>' +
          '<button class="btn primary" id="btn-add-oficial">Salvar</button>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-head"><h2>Colar em lote (CSV)</h2><span class="hint">uma linha por partido: <span class="mono">nome,votos</span></span></div>' +
          '<div class="field"><textarea id="of-csv" placeholder="PL,320000&#10;PT,210000&#10;UNIÃO,190000"></textarea></div>' +
          '<button class="btn" id="btn-import-oficial">Importar linhas</button>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head"><h2>Ajustar total de votos válidos</h2><span class="hint">opcional — use enquanto nem todos os partidos foram lançados</span></div>' +
        '<div class="field-row">' +
          '<div class="field"><label for="of-override">Total de votos válidos (substitui a soma acima)</label><input type="number" id="of-override" min="0" step="1" value="' + (usandoOverride ? esc(state.config.votosValidosOverride) : '') + '" placeholder="deixe em branco para somar automaticamente"></div>' +
          '<div style="display:flex; align-items:flex-end; padding-bottom: 12px; gap:8px;"><button class="btn" id="btn-save-override">Salvar</button><button class="btn ghost" id="btn-clear-override">Limpar</button></div>' +
        '</div>' +
        '<div class="banner"><span>ℹ️</span><div>Some dos partidos já lançados: <b class="mono">' + fmt(somaPartidos) + '</b> votos. O TSE também divulga o total de votos válidos do estado — use esse número aqui se quiser projetar antes de lançar todos os partidos.</div></div>' +
      '</div>';
  }

  /* ---------------- view: Projeção de Vagas ---------------- */
  function viewProjecao() {
    var dist = distribuicaoAtual();
    var st = statusCandidato();

    var tabelaPartidos = dist.resultado.length ? dist.resultado.map(function (r) {
      var isNosso = (state.config.partido || '').trim().toLowerCase() === r.nome.toLowerCase();
      return '<tr class="' + (isNosso ? 'row-highlight' : '') + '">' +
        '<td>' + esc(r.nome) + (isNosso ? ' <span class="pill brand">seu partido</span>' : '') + '</td>' +
        '<td class="num">' + fmt(r.votos) + '</td>' +
        '<td class="num">' + fmt(r.vagasQP) + '</td>' +
        '<td class="num">' + fmt(r.vagasSobra) + '</td>' +
        '<td class="num" style="font-weight:700;">' + fmt(r.vagasTotal) + '</td>' +
        '</tr>';
    }).join('') : '<tr><td colspan="5" class="empty">Lance os partidos na aba Apuração Oficial primeiro.</td></tr>';

    var candRows = '';
    if (st.kind === 'com-dados') {
      candRows = st.candidatos.map(function (c, i) {
        var pill = c.eleito ? '<span class="pill ok">eleito</span>' : (!c.passaClausula ? '<span class="pill danger">abaixo da cláusula</span>' : '<span class="pill neutral">fora da faixa</span>');
        return '<tr class="' + (c.ehNosso ? 'row-highlight' : '') + '">' +
          '<td class="num" style="color:var(--ink-faint);">' + (i + 1) + 'º</td>' +
          '<td>' + esc(c.nome) + (c.ehNosso ? ' <span class="pill brand">seu candidato</span>' : '') + '</td>' +
          '<td class="num" style="color:var(--ink-faint);">' + esc(c.numero || '—') + '</td>' +
          '<td class="num">' + fmt(c.votos) + '</td>' +
          '<td class="num">' + pct(dist.QE > 0 ? c.votos / dist.QE : 0) + '</td>' +
          '<td>' + pill + '</td>' +
          '<td><button class="btn small ghost" data-del-cand="' + esc(c.id) + '">remover</button></td>' +
          '</tr>';
      }).join('');
    }

    var resumoCandidato = '';
    if (st.kind === 'sem-dados') {
      resumoCandidato = '<div class="empty">Lance os votos por partido na aba <b>Apuração Oficial</b> para ver a projeção de vagas.</div>';
    } else if (!st.nosso) {
      resumoCandidato = '<div class="empty">Cadastre o candidato de vocês na lista abaixo (marcando "é o nosso candidato") para ver a projeção individual.</div>';
    } else {
      var n = st.nosso;
      var faltamClausula = Math.max(0, Math.ceil(n.minimoNecessario - n.votos));
      var statusLabel, statusClass, explicacao;
      if (n.eleito) {
        statusLabel = 'Eleito na projeção atual';
        statusClass = 'ok';
        explicacao = n.votos >= n.minimoNecessario
          ? 'Com os números lançados até agora, o candidato ocupa uma das ' + fmt(st.vagasDoPartido) + ' vagas projetadas para ' + esc(state.config.partido) + '.'
          : '';
      } else if (!n.passaClausula) {
        statusLabel = 'Abaixo da cláusula de desempenho';
        statusClass = 'danger';
        explicacao = 'Precisa de ao menos 10% do quociente eleitoral (' + fmt(Math.ceil(n.minimoNecessario)) + ' votos) para poder ser eleito. Faltam ' + fmt(faltamClausula) + ' votos para atingir esse mínimo.';
      } else {
        statusLabel = 'Fora da faixa de vagas do partido';
        statusClass = 'warn';
        var ultimoEleito = st.candidatos.filter(function (c) { return c.eleito; }).pop();
        var faltamVotos = ultimoEleito ? Math.max(0, (ultimoEleito.votos - n.votos) + 1) : null;
        explicacao = ultimoEleito
          ? 'O partido projeta ' + fmt(st.vagasDoPartido) + ' vaga(s). Para entrar na lista de eleitos, o candidato precisaria ultrapassar ' + esc(ultimoEleito.nome) + ' — faltam aproximadamente ' + fmt(faltamVotos) + ' votos.'
          : 'O partido não projeta vagas suficientes para este candidato com os números atuais.';
      }
      resumoCandidato =
        '<div class="metric" style="margin-bottom:10px;"><span class="pill ' + statusClass + '" style="font-size:13px; padding:5px 12px;">' + statusLabel + '</span></div>' +
        '<div class="kv"><span class="k">Candidato</span><span class="v" style="font-family:Archivo;">' + esc(n.nome) + '</span></div>' +
        '<div class="kv"><span class="k">Votos nominais</span><span class="v">' + fmt(n.votos) + '</span></div>' +
        '<div class="kv"><span class="k">% do quociente eleitoral</span><span class="v">' + pct(dist.QE > 0 ? n.votos / dist.QE : 0) + '</span></div>' +
        '<div class="kv"><span class="k">Posição entre os candidatos cadastrados do partido</span><span class="v">' + (st.candidatos.indexOf(n) + 1) + 'º de ' + st.candidatos.length + '</span></div>' +
        '<div class="kv"><span class="k">Vagas projetadas do partido</span><span class="v">' + fmt(st.vagasDoPartido) + '</span></div>' +
        (explicacao ? '<div class="banner" style="margin-top:10px;">' + explicacao + '</div>' : '') +
        '<div class="chart-card" style="margin-top:16px;"><div class="eyebrow">Medidor — % do quociente eleitoral</div>' + chartMeterCandidato(st) + '</div>';
    }

    return '' +
      '<div class="banner warn"><span>⚠️</span><div>Simulação estratégica — não é o resultado oficial. Os números válidos são sempre os divulgados pela Justiça Eleitoral (TSE / TRE-ES). Veja a aba <b>Metodologia</b> para as regras usadas no cálculo.</div></div>' +

      '<div class="grid cols-2">' +
        '<div class="card"><h2 style="margin-bottom:12px;">Seu candidato</h2>' + resumoCandidato + '</div>' +
        '<div class="card">' +
          '<div class="card-head"><h2>Candidatos do partido (para a disputa interna)</h2></div>' +
          (candidatosTseDoPartido(state.config.partido).length ?
            '<div class="banner"><span>📋</span><div>O TSE lista <b>' + candidatosTseDoPartido(state.config.partido).length + ' candidatos aptos</b> por ' + esc(state.config.partido) + ' a deputado estadual no ES. <button class="btn small primary" id="btn-seed-candidatos" style="margin-top:8px;">Carregar todos (votos = 0)</button></div></div>'
            : '') +
          '<div class="field-row">' +
            '<div class="field"><label for="cand-nome">Nome do candidato</label><input type="text" id="cand-nome" placeholder="Nome de urna"></div>' +
            '<div class="field"><label for="cand-numero">Número</label><input type="text" id="cand-numero" placeholder="Ex: 36222"></div>' +
            '<div class="field"><label for="cand-votos">Votos nominais</label><input type="number" id="cand-votos" min="0" step="1"></div>' +
          '</div>' +
          '<label style="display:flex; align-items:center; gap:8px; font-weight:500; margin-bottom:12px;"><input type="checkbox" id="cand-ehnosso" style="width:auto;"> É o nosso candidato</label>' +
          '<button class="btn primary" id="btn-add-cand">Adicionar / atualizar</button>' +
        '</div>' +
      '</div>' +

      (st.kind === 'com-dados' && st.candidatos.length ?
      '<div class="card">' +
        '<div class="card-head"><h2>Ranking interno de ' + esc(state.config.partido || 'do partido') + '</h2><span class="hint">cláusula de desempenho: ≥10% do QE · fonte dos nomes: TSE (candidatos aptos)</span></div>' +
        '<div class="table-wrap"><table><thead><tr><th>#</th><th>Candidato</th><th class="num">Nº</th><th class="num">Votos</th><th class="num">% do QE</th><th>Status</th><th></th></tr></thead><tbody>' + candRows + '</tbody></table></div>' +
      '</div>' : '') +

      '<div class="card">' +
        '<div class="card-head"><h2>Projeção de vagas por partido/federação — Assembleia Legislativa do ES</h2></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Partido / federação</th><th class="num">Votos</th><th class="num">Vagas (quociente)</th><th class="num">Vagas (sobras)</th><th class="num">Total</th></tr></thead>' +
        '<tbody>' + tabelaPartidos + '</tbody></table></div>' +
      '</div>' +

      '<div class="grid cols-2">' +
        '<div class="card chart-card"><div class="card-head"><h2>Vagas projetadas por partido</h2></div>' + chartVagasPorPartido() + '</div>' +
        '<div class="card chart-card"><div class="card-head"><h2>Distribuição dos votos válidos</h2></div>' + chartDistribuicaoVotos() + '</div>' +
      '</div>' +

      '<div class="card chart-card">' +
        '<div class="card-head"><h2>Evolução ao longo da noite</h2><span class="hint">% do quociente eleitoral do candidato, ponto a ponto</span></div>' +
        chartEvolucao() +
      '</div>' +

      cardSimulador(st) +

      cardMarcosImportantes();
  }

  /* ---------------- card: simulador "e se" ---------------- */
  function cardSimulador(st) {
    var podeSimular = st.kind === 'com-dados';
    var resultadoHtml = '';
    if (simResultado) {
      var r = simResultado;
      if (!r.nosso) {
        resultadoHtml = '<div class="empty">Cadastre o candidato de vocês na lista de candidatos do partido para simular.</div>';
      } else {
        var cSim = classificarStatus({ kind: 'com-dados', nosso: r.nosso, QE: r.QE });
        resultadoHtml =
          '<div class="divider" style="margin:14px 0;"></div>' +
          '<div class="metric" style="margin-bottom:8px;"><span class="pill ' + cSim.classe + '" style="font-size:13px; padding:5px 12px;">Cenário simulado: ' + esc(cSim.label.replace('Projeção: ', '')) + '</span></div>' +
          '<div class="kv"><span class="k">Novo quociente eleitoral (QE)</span><span class="v">' + fmt(r.QE) + '</span></div>' +
          '<div class="kv"><span class="k">Votos simulados do candidato</span><span class="v">' + fmt(r.nosso.votos) + '</span></div>' +
          '<div class="kv"><span class="k">% do QE simulado</span><span class="v">' + pct(r.QE > 0 ? r.nosso.votos / r.QE : 0) + '</span></div>' +
          '<div class="kv"><span class="k">Vagas simuladas do partido</span><span class="v">' + fmt(r.vagasDoPartido) + '</span></div>';
      }
    }
    return '<div class="card">' +
      '<div class="card-head"><h2>Simulador "e se"</h2><span class="hint">cenário hipotético — não é salvo, só afeta esta tela</span></div>' +
      '<p style="font-size:13px; color:var(--ink-soft); margin:0 0 12px;">Diga quantos votos ainda podem entrar e veja como a projeção mudaria. É uma aproximação: assume que os demais partidos e candidatos do partido crescem na mesma proporção que já têm hoje, exceto os números que você preencher abaixo.</p>' +
      (podeSimular ? (
        '<div class="field-row">' +
          '<div class="field"><label for="sim-total">Votos válidos ainda a apurar (estado)</label><input type="number" id="sim-total" min="0" step="1" value="' + esc(simInputs.total) + '" placeholder="Ex: 300000"></div>' +
          '<div class="field"><label for="sim-partido">Desses, quantos para ' + esc(state.config.partido || 'o partido') + '</label><input type="number" id="sim-partido" min="0" step="1" value="' + esc(simInputs.partido) + '" placeholder="Ex: 15000"></div>' +
          '<div class="field"><label for="sim-candidato">E quantos nominais para o candidato</label><input type="number" id="sim-candidato" min="0" step="1" value="' + esc(simInputs.candidato) + '" placeholder="Ex: 4000"></div>' +
        '</div>' +
        '<button class="btn primary" id="btn-simular">Simular</button>' +
        resultadoHtml
      ) : '<div class="empty">Lance os votos por partido na aba Apuração Oficial para habilitar o simulador.</div>') +
      '</div>';
  }

  /* ---------------- card: marcos importantes (linha do tempo de mudanças de status) ---------------- */
  function cardMarcosImportantes() {
    var marcos = marcosDoHistorico();
    var linhas = marcos.length ? marcos.map(function (m) {
      return '<div class="kv"><span class="k">' + fmtWhen(m.t) + '</span><span class="v">' + esc(LABEL_MARCO[m.marco] || m.marco) + '</span></div>';
    }).join('') : '<div class="empty">Nenhuma mudança de marco registrada ainda — o histórico é preenchido conforme os dados oficiais são atualizados.</div>';
    return '<div class="card"><div class="card-head"><h2>Marcos importantes</h2><span class="hint">mudanças de status do candidato ao longo da apuração</span></div>' + linhas + '</div>';
  }

  /* ---------------- view: Apuração Paralela (fiscais) ---------------- */
  function viewFiscais() {
    var subs = state.fiscais;
    var st = statusCandidato();
    var totalVotosCand = subs.reduce(function (s, f) { return s + (Number(f.votosCandidato) || 0); }, 0);
    var totalSecaoInformado = subs.reduce(function (s, f) { return s + (Number(f.totalSecao) || 0); }, 0);
    var esperado = Number(state.config.expectedSecoes) || 0;
    var cobertura = esperado > 0 ? subs.length / esperado : null;

    var porMunicipio = {};
    var porZona = {};
    subs.forEach(function (f) {
      var km = (f.municipio || 'Sem município').trim() || 'Sem município';
      if (!porMunicipio[km]) porMunicipio[km] = { secoes: 0, votosCandidato: 0, votosPartido: 0, totalSecao: 0 };
      porMunicipio[km].secoes += 1;
      porMunicipio[km].votosCandidato += Number(f.votosCandidato) || 0;
      porMunicipio[km].votosPartido += Number(f.votosPartido) || 0;
      porMunicipio[km].totalSecao += Number(f.totalSecao) || 0;

      var kz = km + ' · Zona ' + ((f.zona || '').trim() || '—');
      if (!porZona[kz]) porZona[kz] = { secoes: 0, votosCandidato: 0, votosPartido: 0, totalSecao: 0 };
      porZona[kz].secoes += 1;
      porZona[kz].votosCandidato += Number(f.votosCandidato) || 0;
      porZona[kz].votosPartido += Number(f.votosPartido) || 0;
      porZona[kz].totalSecao += Number(f.totalSecao) || 0;
    });
    var municipiosOrdenados = Object.keys(porMunicipio).sort(function (a, b) { return porMunicipio[b].votosCandidato - porMunicipio[a].votosCandidato; });
    var zonasOrdenadas = Object.keys(porZona).sort(function (a, b) { return porZona[b].votosCandidato - porZona[a].votosCandidato; });

    var resumoMunicipioRows = municipiosOrdenados.length ? municipiosOrdenados.map(function (m) {
      var d = porMunicipio[m];
      var aproveitamento = d.totalSecao > 0 ? d.votosCandidato / d.totalSecao : null;
      return '<tr><td>' + esc(m) + '</td><td class="num">' + fmt(d.secoes) + '</td><td class="num" style="font-weight:700;">' + fmt(d.votosCandidato) + '</td><td class="num">' + fmt(d.votosPartido) + '</td><td class="num">' + fmt(d.totalSecao) + '</td><td class="num">' + (aproveitamento === null ? '—' : pct(aproveitamento)) + '</td></tr>';
    }).join('') : '<tr><td colspan="6" class="empty">Nenhuma seção reportada ainda.</td></tr>';

    var resumoZonaRows = zonasOrdenadas.length ? zonasOrdenadas.slice(0, 30).map(function (k) {
      var d = porZona[k];
      var aproveitamento = d.totalSecao > 0 ? d.votosCandidato / d.totalSecao : null;
      return '<tr><td>' + esc(k) + '</td><td class="num">' + fmt(d.secoes) + '</td><td class="num" style="font-weight:700;">' + fmt(d.votosCandidato) + '</td><td class="num">' + fmt(d.votosPartido) + '</td><td class="num">' + (aproveitamento === null ? '—' : pct(aproveitamento)) + '</td></tr>';
    }).join('') : '<tr><td colspan="5" class="empty">Nenhuma seção reportada ainda.</td></tr>';

    var totalComProblema = subs.reduce(function (s, f) { return s + (validarBoletim(f).length ? 1 : 0); }, 0);

    var listaRows = subs.slice().reverse().slice(0, 60).map(function (f) {
      var problemas = validarBoletim(f);
      var temProblema = problemas.length > 0;
      return '<tr class="' + (temProblema ? 'row-warn' : '') + '">' +
        '<td>' + esc(f.municipio) + '</td>' +
        '<td>' + esc(f.zona) + '</td>' +
        '<td>' + esc(f.secao) + '</td>' +
        '<td class="num">' + fmt(f.votosCandidato) + '</td>' +
        '<td class="num">' + fmt(f.votosPartido) + '</td>' +
        '<td class="num">' + fmt(f.totalSecao) + '</td>' +
        '<td style="font-size:11.5px; color:var(--ink-faint);">' + esc(f.fiscal || f.registradoPor || '—') + '</td>' +
        '<td>' + (temProblema ? '<span class="pill warn" title="' + esc(problemas.join('; ')) + '">⚠ conferir</span>' : '') + '</td>' +
        '<td><button class="btn small ghost" data-del-fiscal="' + esc(f.id) + '">remover</button></td>' +
        '</tr>';
    }).join('') || '<tr><td colspan="9" class="empty">Nenhum boletim reportado ainda.</td></tr>';

    var comp = comparativoParalelaOficial(st);
    var cardComparativo = '<div class="card">' +
      '<div class="card-head"><h2>Comparativo: paralela × oficial</h2><span class="hint">sinal aproximado, não é detecção de fraude</span></div>' +
      (comp.disponivel
        ? ('<div class="kv"><span class="k">% do candidato sobre o partido — apuração paralela</span><span class="v">' + pct(comp.shareParalela) + '</span></div>' +
           '<div class="kv"><span class="k">% do candidato sobre o partido — apuração oficial</span><span class="v">' + pct(comp.shareOficial) + '</span></div>' +
           '<div class="kv"><span class="k">Diferença</span><span class="v"><span class="pill ' + comp.classe + '">' + (comp.diffPontos >= 0 ? '+' : '') + comp.diffPontos.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' p.p.</span></span></div>' +
           '<div class="banner' + (comp.classe === 'ok' ? '' : ' warn') + '" style="margin-top:10px;"><span>' + (comp.classe === 'ok' ? '✅' : '⚠️') + '</span><div>' +
             (comp.classe === 'ok'
               ? 'A proporção que os fiscais estão reportando bate, dentro do esperado, com o que está sendo lançado oficialmente.'
               : 'Há uma diferença ' + (comp.classe === 'danger' ? 'grande' : 'perceptível') + ' entre o que os fiscais reportam e a apuração oficial — pode ser só amostra pequena/concentrada em algumas regiões, mas vale conferir se os boletins e os lançamentos oficiais estão corretos.') +
           '</div></div>' +
           '<div class="hint" style="margin-top:8px;">Baseado em ' + comp.secoesUsadas + ' boletim(ns) com votos de partido preenchidos. Compara apenas a proporção candidato/partido — não o volume de votos.</div>')
        : ('<div class="empty">Aguardando pelo menos ' + MIN_SECOES_PARA_COMPARATIVO + ' boletins com "votos de legenda do partido" preenchidos, e dados oficiais lançados, para calcular este comparativo (' + comp.secoesUsadas + ' boletim(ns) válido(s) até agora).</div>')) +
      '</div>';

    var covResult = coberturaPorZona();
    var cardCobertura = '<div class="card">' +
      '<div class="card-head"><h2>Cobertura por zona esperada</h2><span class="hint">configurável na aba Configuração</span></div>' +
      (covResult
        ? ('<div class="metric" style="margin-bottom:10px;"><span class="pill ' + (covResult.faltando.length === 0 ? 'ok' : 'warn') + '" style="font-size:13px; padding:5px 12px;">' + covResult.cobertas.length + ' de ' + covResult.total + ' zonas já reportaram</span></div>' +
           (covResult.faltando.length
             ? '<div class="hint" style="margin-bottom:6px;">Ainda sem nenhum boletim:</div><div style="display:flex; flex-wrap:wrap; gap:6px;">' +
               covResult.faltando.slice(0, 40).map(function (e) { return '<span class="pill danger">' + esc(e.municipio) + (e.zona ? ' · Zona ' + esc(e.zona) : '') + '</span>'; }).join('') +
               (covResult.faltando.length > 40 ? '<span class="hint">+ ' + (covResult.faltando.length - 40) + ' outra(s)</span>' : '') + '</div>'
             : '<div class="empty">Todas as zonas esperadas já têm pelo menos um boletim registrado. 🎉</div>'))
        : '<div class="empty">Cadastre a lista de zonas esperadas na aba Configuração (uma por linha: <span class="mono">Município,Zona</span>) para acompanhar a cobertura em detalhe.</div>') +
      '</div>';

    return '' +
      '<div class="grid cols-3">' +
        '<div class="card"><div class="eyebrow">Seções reportadas</div><div class="metric"><div class="value mono" style="color:var(--accent);">' + fmt(subs.length) + '</div><div class="label">' + (esperado ? pct(cobertura) + ' da cobertura esperada' : 'defina a cobertura esperada na Configuração') + '</div></div></div>' +
        '<div class="card"><div class="eyebrow">Votos do candidato (seções reportadas)</div><div class="metric"><div class="value mono" style="color:var(--accent-3);">' + fmt(totalVotosCand) + '</div><div class="label">soma das seções abaixo</div></div></div>' +
        '<div class="card"><div class="eyebrow">Total de votantes nas seções reportadas</div><div class="metric"><div class="value mono" style="color:var(--accent-2);">' + fmt(totalSecaoInformado) + '</div><div class="label">' + (totalSecaoInformado ? pct(totalVotosCand / totalSecaoInformado) + ' de aproveitamento' : '—') + '</div></div></div>' +
      '</div>' +

      '<div class="banner"><span>👥</span><div>Este módulo é para <b>apuração paralela própria</b> — fiscais e coordenadores registrando boletins de urna observados nas seções, para acompanhamento independente da campanha. Não substitui a apuração oficial da Justiça Eleitoral.</div></div>' +

      (totalComProblema > 0 ? '<div class="banner warn"><span>⚠️</span><div><b>' + totalComProblema + ' boletim(ns)</b> com números que parecem inconsistentes (ex: votos maiores que o total de votantes da seção). Estão marcados com ⚠ na tabela "Boletins registrados", mais abaixo — vale conferir com quem registrou.</div></div>' : '') +

      '<div class="grid cols-2">' +
        '<div class="card">' +
          '<div class="card-head"><h2>Registrar boletim de uma seção</h2></div>' +
          '<div class="field-row">' +
            '<div class="field"><label for="f-municipio">Município</label><input type="text" id="f-municipio" placeholder="Ex: Vitória"></div>' +
            '<div class="field"><label for="f-zona">Zona</label><input type="text" id="f-zona" placeholder="Ex: 012"></div>' +
            '<div class="field"><label for="f-secao">Seção</label><input type="text" id="f-secao" placeholder="Ex: 0034"></div>' +
          '</div>' +
          '<div class="field-row">' +
            '<div class="field"><label for="f-votoscand">Votos do candidato</label><input type="number" id="f-votoscand" min="0" step="1"></div>' +
            '<div class="field"><label for="f-votospartido">Votos de legenda do partido</label><input type="number" id="f-votospartido" min="0" step="1"></div>' +
            '<div class="field"><label for="f-total">Total de votantes na seção</label><input type="number" id="f-total" min="0" step="1"></div>' +
          '</div>' +
          '<div class="field"><label for="f-obs">Observação (opcional)</label><input type="text" id="f-obs" placeholder="Ex: BU fotografado, sem divergência"></div>' +
          '<div class="field"><label for="f-nome">Seu nome (fica salvo neste navegador)</label><input type="text" id="f-nome" value="' + esc(meuNome) + '" placeholder="Nome do fiscal / coordenador"></div>' +
          '<button class="btn primary" id="btn-add-fiscal">Registrar seção</button>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-head"><h2>Importar em lote (CSV)</h2><span class="hint">municipio,zona,secao,votosCandidato,votosPartido,totalSecao,fiscal</span></div>' +
          '<div class="field"><textarea id="f-csv" placeholder="Vitória,012,0034,187,240,320,João&#10;Vila Velha,045,0110,142,205,300,Maria"></textarea></div>' +
          '<button class="btn" id="btn-import-fiscal">Importar linhas</button>' +
          '<div class="divider" style="margin:14px 0;"></div>' +
          '<div class="field"><label for="f-esperado">Total de seções esperadas (cobertura)</label><input type="number" id="f-esperado" min="0" step="1" value="' + (state.config.expectedSecoes || '') + '" placeholder="Ex: 120"></div>' +
          '<button class="btn" id="btn-save-esperado">Salvar cobertura esperada</button>' +
        '</div>' +
      '</div>' +

      '<div class="grid cols-2">' +
        cardComparativo +
        cardCobertura +
      '</div>' +

      '<div class="card chart-card">' +
        '<div class="card-head"><h2>Ranking de votos por município</h2><span class="hint">com base nos boletins registrados pelos fiscais — não são dados oficiais do TSE</span></div>' +
        chartVotosPorMunicipio(porMunicipio, municipiosOrdenados) +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head"><h2>Consolidado por município</h2></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Município</th><th class="num">Seções</th><th class="num">Votos do candidato</th><th class="num">Votos do partido</th><th class="num">Total de votantes</th><th class="num">% aproveitamento</th></tr></thead><tbody>' + resumoMunicipioRows + '</tbody></table></div>' +
      '</div>' +

      '<div class="card chart-card">' +
        '<div class="card-head"><h2>Ranking de votos por zona eleitoral</h2><span class="hint">com base nos boletins registrados pelos fiscais</span></div>' +
        chartVotosPorZona(porZona, zonasOrdenadas) +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head"><h2>Consolidado por zona eleitoral</h2><span class="hint">mostrando as ' + Math.min(30, zonasOrdenadas.length) + ' com mais votos de ' + zonasOrdenadas.length + '</span></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Município / zona</th><th class="num">Seções</th><th class="num">Votos do candidato</th><th class="num">Votos do partido</th><th class="num">% aproveitamento</th></tr></thead><tbody>' + resumoZonaRows + '</tbody></table></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head"><h2>Boletins registrados</h2><span class="hint">mostrando os ' + Math.min(60, subs.length) + ' mais recentes de ' + fmt(subs.length) + '</span></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Município</th><th>Zona</th><th>Seção</th><th class="num">Cand.</th><th class="num">Partido</th><th class="num">Total</th><th>Fiscal</th><th></th><th></th></tr></thead><tbody>' + listaRows + '</tbody></table></div>' +
      '</div>';
  }

  /* ---------------- view: Candidatos (TSE) ---------------- */
  function viewCandidatosTse() {
    var lista = candidatosTseFiltrados(filtroCandTexto).slice(0, 300);
    var rows = lista.length ? lista.map(function (c) {
      return '<tr><td class="num" style="color:var(--ink-faint);">' + esc(c[2]) + '</td><td>' + esc(c[0]) + '</td><td>' + esc(c[1]) + '</td></tr>';
    }).join('') : '<tr><td colspan="3" class="empty">Nenhum candidato encontrado para esse filtro.</td></tr>';
    var total = candidatosTseFiltrados(filtroCandTexto).length;
    return '' +
      '<div class="banner"><span>🗂️</span><div>Lista oficial de candidatos <b>aptos (concorrendo)</b> a deputado estadual no Espírito Santo — eleições 2026, conforme <a href="https://divulgacandcontas.tse.jus.br/divulga/#/candidato/SUDESTE/ES/20322002026" target="_blank" rel="noopener">divulgação de candidaturas do TSE</a>. Use para conferir nomes e números na hora de lançar dados oficiais.</div></div>' +
      '<div class="card">' +
        '<div class="card-head"><h2>' + fmt(CANDIDATOS_TSE_ES2026.length) + ' candidatos aptos</h2><span class="hint">' + fmt(total) + ' encontrados com o filtro atual</span></div>' +
        '<div class="field"><input type="text" id="cand-tse-filtro" placeholder="Buscar por nome, número ou partido/federação..." value="' + esc(filtroCandTexto) + '"></div>' +
        '<div class="table-wrap" style="max-height:520px; overflow-y:auto;"><table><thead><tr><th class="num">Nº</th><th>Nome de urna</th><th>Partido / federação</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        (lista.length < total ? '<div class="hint" style="margin-top:8px;">Mostrando os primeiros 300 resultados — refine a busca para ver outros.</div>' : '') +
      '</div>';
  }

  /* ---------------- view: Configuração ---------------- */
  function viewConfig() {
    var orgBanner = state.dbAvailable === false ?
      '<div class="banner warn"><span>⚠️</span><div>Sem conexão com a planilha de dados no momento. Os dados não estão sendo salvos nem atualizados — confira sua internet, ou clique em "Reconfigurar conexão" abaixo.</div></div>' : '';
    return '' +
      orgBanner +
      '<div class="banner"><span>🔒</span><div><b>Importante sobre compartilhamento:</b> os dados deste painel ficam guardados numa planilha Google, acessada através de uma URL e uma chave de acesso já embutidas no painel (conecta sozinho em qualquer aparelho). Quem tiver acesso ao código deste site consegue ler essas informações — evite deixar o repositório público, ou troque a chave se precisar revogar o acesso de alguém (veja o card "Conexão com os dados" mais abaixo).</div></div>' +
      '<div class="card">' +
        '<div class="card-head"><h2>Conexão com os dados</h2><span class="hint">planilha Google via Apps Script</span></div>' +
        '<p style="font-size:13px; color:var(--ink-soft); margin:0 0 12px;">' + (state.dbAvailable ? 'Conectado automaticamente — os dados sincronizam a cada alguns segundos.' : 'Não conectado.') + '</p>' +
        '<button class="btn" id="btn-reconfigurar-conexao">Usar outra URL/chave neste navegador</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><h2>Dados do candidato</h2></div>' +
        '<div class="field-row">' +
          '<div class="field"><label for="cfg-candidato">Nome do candidato</label><input type="text" id="cfg-candidato" value="' + esc(state.config.candidato) + '"></div>' +
          '<div class="field"><label for="cfg-candidatonumero">Número do candidato</label><input type="text" id="cfg-candidatonumero" value="' + esc(state.config.candidatoNumero) + '"></div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><label for="cfg-partido">Partido (como aparece na apuração oficial)</label><input type="text" id="cfg-partido" value="' + esc(state.config.partido) + '"></div>' +
          '<div class="field"><label for="cfg-federacao">Federação (se houver)</label><input type="text" id="cfg-federacao" value="' + esc(state.config.federacao) + '" placeholder="Opcional"></div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><label for="cfg-vagas">Vagas em disputa (ALES)</label><input type="number" id="cfg-vagas" min="1" step="1" value="' + esc(state.config.vagas || VAGAS_ALES) + '"></div>' +
        '</div>' +
        '<button class="btn primary" id="btn-save-config">Salvar configuração</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><h2>Carregar dados oficiais do TSE</h2><span class="hint">candidatos "aptos" (concorrendo) a deputado estadual — ES 2026</span></div>' +
        '<p style="font-size:13px; color:var(--ink-soft); margin:0 0 12px;">Popula a aba "Apuração Oficial" com os ' + fmt(UNIDADES_PARTIDARIAS_ES2026.length) + ' partidos/federações concorrentes (votos = 0, prontos para você atualizar) e a aba "Projeção" com os candidatos aptos do partido configurado acima. Não sobrescreve votos já lançados.</p>' +
        '<div style="display:flex; gap:10px; flex-wrap:wrap;">' +
          '<button class="btn primary" id="btn-seed-oficial">Carregar partidos/federações (' + fmt(UNIDADES_PARTIDARIAS_ES2026.length) + ')</button>' +
          '<button class="btn" id="btn-seed-candidatos-cfg">Carregar candidatos de ' + esc(state.config.partido || 'seu partido') + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><h2>Zonas esperadas para a apuração paralela</h2><span class="hint">opcional — alimenta o card "Cobertura por zona esperada"</span></div>' +
        '<p style="font-size:13px; color:var(--ink-soft); margin:0 0 10px;">Liste os municípios/zonas onde a campanha tem fiscal escalado, um por linha, no formato <span class="mono">Município,Zona</span> (a zona é opcional — pode listar só o município). O painel mostra na aba Apuração Paralela quais dessas zonas já têm pelo menos um boletim registrado.</p>' +
        '<div class="field"><textarea id="cfg-zonas-esperadas" placeholder="Vitória,012&#10;Vila Velha,045&#10;Cachoeiro de Itapemirim">' + esc((state.config.zonasEsperadas || []).map(function (e) { return e.municipio + (e.zona ? ',' + e.zona : ''); }).join('\n')) + '</textarea></div>' +
        '<button class="btn" id="btn-save-zonas-esperadas">Salvar zonas esperadas</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><h2>Exportar dados</h2><span class="hint">baixa um snapshot em CSV para arquivar ou compartilhar fora do painel</span></div>' +
        '<div style="display:flex; gap:10px; flex-wrap:wrap;">' +
          '<button class="btn" id="btn-export-oficial">Exportar apuração oficial (.csv)</button>' +
          '<button class="btn" id="btn-export-fiscais">Exportar apuração paralela (.csv)</button>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- view: Metodologia ---------------- */
  function viewMetodologia() {
    return '' +
      '<div class="card">' +
        '<h2 style="margin-bottom:10px;">Como este painel calcula as projeções</h2>' +
        '<div class="kv"><span class="k">1. Quociente eleitoral (QE)</span><span class="v" style="font-weight:400; font-family:Archivo; text-align:right; max-width:60%;">votos válidos do estado ÷ número de vagas (30 na ALES), desprezada a fração — Código Eleitoral, art. 106.</span></div>' +
        '<div class="kv"><span class="k">2. Quociente partidário</span><span class="v" style="font-weight:400; font-family:Archivo; text-align:right; max-width:60%;">votos do partido/federação ÷ QE, desprezada a fração — vagas garantidas na primeira fase (art. 107).</span></div>' +
        '<div class="kv"><span class="k">3. Sobras (método das médias)</span><span class="v" style="font-weight:400; font-family:Archivo; text-align:right; max-width:60%;">vagas não preenchidas são distribuídas uma a uma ao partido com maior média (votos ÷ vagas obtidas + 1), entre os que atingiram 80% do QE — art. 109.</span></div>' +
        '<div class="kv"><span class="k">4. Última fase (regra do STF, 2024)</span><span class="v" style="font-weight:400; font-family:Archivo; text-align:right; max-width:60%;">se nenhum partido atingir 80% do QE e ainda houver vaga a preencher, todos os partidos voltam a concorrer pela média — decisão do STF de fev/2024, válida a partir das eleições seguintes.</span></div>' +
        '<div class="kv"><span class="k">5. Cláusula de desempenho individual</span><span class="v" style="font-weight:400; font-family:Archivo; text-align:right; max-width:60%;">o candidato só é eleito se tiver ao menos 10% do QE em votos nominais, mesmo estando dentro do número de vagas do partido (vale para deputado estadual desde 2018).</span></div>' +
      '</div>' +
      '<div class="card">' +
        '<h2 style="margin-bottom:10px;">Limitações importantes</h2>' +
        '<ul style="margin:0; padding-left:20px; font-size:13.5px; line-height:1.7; color:var(--ink-soft);">' +
          '<li>O ranking interno do partido considera apenas os candidatos que a equipe cadastrar — se faltar gente na lista, a posição do seu candidato pode ficar imprecisa.</li>' +
          '<li>Quando um candidato de outro partido não atinge a cláusula de desempenho, a vaga pode ser redistribuída entre partidos de formas que este simulador não reproduz em detalhe — trate a projeção como uma estimativa, não como o resultado oficial.</li>' +
          '<li>Os números só valem o que for lançado nas abas "Apuração Oficial" e "Projeção" — o painel não busca dados automaticamente do TSE.</li>' +
        '</ul>' +
      '</div>' +

  /* ---------------- escrita no db ---------------- */
  function requireDb() { return !!db; }

  function saveConfig(partial) {
    if (!requireDb()) return;
    var novo = Object.assign({}, state.config, partial, { atualizadoEm: nowIso() });
    db.doc('config/geral').set(novo).catch(function () {});
  }
  function upsertOficial(nome, votos) {
    if (!requireDb()) return;
    var id = slugify(nome);
    db.collection('oficial').doc(id).set({ nome: nome, votos: votos, atualizadoEm: nowIso() }).catch(function () {});
  }
  function deleteOficial(id) {
    if (!requireDb()) return;
    db.collection('oficial').doc(id).delete().catch(function () {});
  }
  function addCandidato(nome, votos, ehNosso, numero) {
    if (!requireDb()) return;
    var existing = numero
      ? state.candidatos.find(function (c) { return c.numero === numero; })
      : state.candidatos.find(function (c) { return c.nome.toLowerCase() === nome.toLowerCase(); });
    if (ehNosso) {
      // garante que só um candidato fique marcado como "nosso"
      state.candidatos.forEach(function (c) {
        if (c.ehNosso && (!existing || c.id !== existing.id)) {
          db.collection('candidatosPartido').doc(c.id).update({ ehNosso: false }).catch(function () {});
        }
      });
    }
    var body = { nome: nome, votos: votos, ehNosso: ehNosso, numero: numero || (existing && existing.numero) || '' };
    if (existing) {
      db.collection('candidatosPartido').doc(existing.id).set(body).catch(function () {});
    } else {
      db.collection('candidatosPartido').add(body).catch(function () {});
    }
  }
  function deleteCandidato(id) {
    if (!requireDb()) return;
    db.collection('candidatosPartido').doc(id).delete().catch(function () {});
  }
  function addFiscal(data) {
    if (!requireDb()) return;
    db.collection('fiscais').add(Object.assign({}, data, { criadoEm: nowIso(), registradoPor: meuNome })).catch(function () {});
  }

  /* ---------------- carregar (seed) a partir dos dados oficiais do TSE ---------------- */
  function seedPartidosOficial() {
    if (!requireDb()) return;
    var existentesSlugs = {};
    state.oficial.forEach(function (p) { existentesSlugs[slugify(p.nome)] = true; });
    UNIDADES_PARTIDARIAS_ES2026.forEach(function (nomePartido) {
      var id = slugify(nomePartido);
      if (existentesSlugs[id]) return; // não sobrescreve votos já lançados
      db.collection('oficial').doc(id).set({ nome: nomePartido, votos: 0, atualizadoEm: nowIso() }).catch(function () {});
    });
  }
  function seedCandidatosDoPartido(nomePartido) {
    if (!requireDb()) return;
    var candidatosTse = candidatosTseDoPartido(nomePartido);
    if (!candidatosTse.length) return;
    var existentesNumeros = {};
    state.candidatos.forEach(function (c) { if (c.numero) existentesNumeros[c.numero] = true; });
    var meuNumero = (state.config.candidatoNumero || '').trim();
    candidatosTse.forEach(function (c) {
      var nomeUrna = c[0], numero = c[2];
      if (existentesNumeros[numero]) return; // não duplica nem sobrescreve votos já lançados
      db.collection('candidatosPartido').add({
        nome: nomeUrna, numero: numero, votos: 0, ehNosso: !!meuNumero && numero === meuNumero,
      }).catch(function () {});
    });
  }

    if (!requireDb()) return;
    db.collection('fiscais').doc(id).delete().catch(function () {});
  }

  /* ---------------- buscar resultado direto do TSE (botão na aba Oficial) ---------------- */
  function atualizarDoTSE() {
    if (!db || !db.buscarTSE) return;
    tseState = { carregando: true, erro: null, preview: null };
    renderAll();
    db.buscarTSE().then(function (res) {
      if (res && res.error) {
        tseState = { carregando: false, erro: res.error, preview: null };
      } else {
        tseState = { carregando: false, erro: null, preview: res };
      }
      renderAll();
    }).catch(function (e) {
      tseState = { carregando: false, erro: String(e && e.message || e), preview: null };
      renderAll();
    });
  }
  function descartarPreviaTSE() {
    tseState = { carregando: false, erro: null, preview: null };
    renderAll();
  }
  function aplicarPreviaTSE() {
    if (!tseState.preview) return;
    var meuNumero = (state.config.candidatoNumero || '').trim();
    (tseState.preview.partidos || []).forEach(function (p) {
      if (p.sigla) upsertOficial(p.sigla, p.votos);
    });
    (tseState.preview.candidatos || []).forEach(function (c) {
      if (!c.numero) return;
      var ehNosso = !!meuNumero && String(c.numero).trim() === meuNumero;
      addCandidato(c.nome || ('Candidato ' + c.numero), c.votos, ehNosso, String(c.numero));
    });
    tseState = { carregando: false, erro: null, preview: null };
    renderAll();
  }

  /* ---------------- linha do tempo (histórico da apuração) ---------------- */
  var MAX_PONTOS_HISTORICO = 150;
  var INTERVALO_MIN_SNAPSHOT_MS = 2 * 60 * 1000; // não registra automaticamente mais de 1x a cada 2 min

  function montarPontoHistorico() {
    var st = statusCandidato();
    if (st.kind !== 'com-dados') return null;
    return {
      t: nowIso(),
      votosValidos: st.dist.votosValidos,
      QE: st.dist.QE,
      vagasDoPartido: st.vagasDoPartido,
      candidatoVotos: st.nosso ? Number(st.nosso.votos) || 0 : null,
      candidatoPctQE: st.nosso && st.dist.QE > 0 ? (Number(st.nosso.votos) || 0) / st.dist.QE : null,
      marco: classificarStatus(st).chave,
    };
  }
  function registrarSnapshotHistorico(forcar) {
    if (!requireDb()) return;
    var ponto = montarPontoHistorico();
    if (!ponto) return;
    var pontos = (state.historico.pontos || []).slice();
    var ultimo = pontos[pontos.length - 1];
    var agoraMs = Date.now();
    var ultimoMs = ultimo ? new Date(ultimo.t).getTime() : 0;
    if (!forcar && ultimo && (agoraMs - ultimoMs) < INTERVALO_MIN_SNAPSHOT_MS) {
      pontos[pontos.length - 1] = ponto; // atualiza o ponto recente em vez de floodar a linha do tempo
    } else {
      pontos.push(ponto);
    }
    if (pontos.length > MAX_PONTOS_HISTORICO) pontos = pontos.slice(pontos.length - MAX_PONTOS_HISTORICO);
    db.doc('historico/pontos').set({ pontos: pontos }).catch(function () {});
  }
  var _ultimaChecagemAuto = 0;
  function talvezRegistrarSnapshotAutomatico() {
    var agora = Date.now();
    if (agora - _ultimaChecagemAuto < 5000) return; // debounce simples
    _ultimaChecagemAuto = agora;
    registrarSnapshotHistorico(false);
  }

  /* ---------------- alerta de marco (muda quando o status do candidato muda) ---------------- */
  function talvezDetectarMudancaDeMarco() {
    var st = statusCandidato();
    if (st.kind !== 'com-dados' || !st.nosso) return;
    var chave = classificarStatus(st).chave;
    if (ultimoMarcoVisto && ultimoMarcoVisto !== chave) {
      marcoFlashAtivo = chave;
      setTimeout(function () { marcoFlashAtivo = null; renderStatusChip(); }, 15000);
    }
    if (ultimoMarcoVisto !== chave) {
      ultimoMarcoVisto = chave;
      safeLocalSet('apuracao_ultimo_marco', chave);
    }
  }
  function marcosDoHistorico() {
    // varre a linha do tempo e lista as trocas de marco, para o log de "marcos importantes"
    var pontos = state.historico.pontos || [];
    var marcos = [];
    var anterior = null;
    pontos.forEach(function (p) {
      if (p.marco && p.marco !== anterior) {
        marcos.push({ t: p.t, marco: p.marco });
        anterior = p.marco;
      }
    });
    return marcos.reverse();
  }
  var LABEL_MARCO = {
    'eleito': 'Entrou na projeção de eleito',

  /* ---------------- export CSV ---------------- */
  function csvEscape(v) {
    var s = v === null || v === undefined ? '' : String(v);
    if (/[",\n;]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function triggerDownload(filename, text) {
    if (downloadsCap) {
      downloadsCap.save({ filename: filename, data: text }).catch(function () { fallbackDownload(filename, text); });
    } else {
      fallbackDownload(filename, text);
    }
  }
  function fallbackDownload(filename, text) {
    try {
      var blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    } catch (e) {}
  }
  function exportOficialCsv() {
    var lines = ['partido,votos,atualizado_em'];
    state.oficial.forEach(function (p) { lines.push([csvEscape(p.nome), p.votos, p.atualizadoEm].join(',')); });
    triggerDownload('apuracao-oficial.csv', lines.join('\n'));
  }
  function exportFiscaisCsv() {
    var lines = ['municipio,zona,secao,votos_candidato,votos_partido,total_secao,fiscal,observacao,criado_em'];
    state.fiscais.forEach(function (f) {
      lines.push([csvEscape(f.municipio), csvEscape(f.zona), csvEscape(f.secao), f.votosCandidato, f.votosPartido, f.totalSecao, csvEscape(f.fiscal || f.registradoPor), csvEscape(f.obs), f.criadoEm].join(','));
    });
    triggerDownload('apuracao-paralela.csv', lines.join('\n'));
  }

  /* ---------------- inicialização ---------------- */
  var _oficialRecebido = false, _candidatosRecebido = false;
  function talvezCarregarAutomaticamente() {
    // na primeira sincronização, se as duas listas ainda estiverem vazias, carrega os dados oficiais do TSE
    if (state.seedFeito || !_oficialRecebido || !_candidatosRecebido) return;

  function subscribeAll() {
    db.doc('config/geral').onSnapshot(function (snap) {
