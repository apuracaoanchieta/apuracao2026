        (erro ? '<div class="banner warn" style="margin-bottom:14px;"><span>⚠️</span><div>' + esc(erro) + '</div></div>' : '') +
        '<div class="field"><label for="setup-url">URL do Web App (Apps Script)</label><textarea id="setup-url" rows="2" placeholder="https://script.google.com/macros/s/AKfycb.../exec">' + esc(urlSalva) + '</textarea></div>' +
        '<div class="field"><label for="setup-token">Chave de acesso</label><input type="text" id="setup-token" value="' + esc(tokenSalvo) + '" placeholder="a mesma chave definida em Code.gs"></div>' +
        '<button class="btn primary" id="btn-setup-conectar">Conectar</button>' +
      '</div></div>';
    var btn = document.getElementById('btn-setup-conectar');
    if (btn) btn.addEventListener('click', function () {
      var url = document.getElementById('setup-url').value.trim();
      var token = document.getElementById('setup-token').value.trim();
      if (!url || !token) return;
      safeLocalSet(GAS_URL_KEY, url);
      safeLocalSet(GAS_TOKEN_KEY, token);
      root.innerHTML = '';
      conectar(url, token);
    });
  }

  function resetarConexao() {
    safeLocalSet(GAS_URL_KEY, '');
    safeLocalSet(GAS_TOKEN_KEY, '');
    if (db && db.pararSincronizacao) db.pararSincronizacao();
    db = null;
    state.dbAvailable = false;
    mostrarTelaConexao();
  }

  // Implementa a mesma interface usada pelo resto do painel (doc/collection/onSnapshot/
  // set/update/delete/add/limit), só que por trás faz fetch() no Web App do Apps Script,
  // com um "polling" (nova consulta a cada poucos segundos) em vez de push em tempo real.
  function criarClienteGAS(baseUrl, token, intervalMs) {
    intervalMs = intervalMs || 6000;
    var docListeners = {};
    var collListeners = {};
    var latest = { config: null, historico: null, oficial: [], candidatosPartido: [], fiscais: [] };
    var pollTimer = null;
    var parada = false;

    function montarUrl(params) {
      var qs = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
      return baseUrl + (baseUrl.indexOf('?') === -1 ? '?' : '&') + qs;
    }
    function apiGetSyncAll() {
      return fetch(montarUrl({ action: 'syncAll', token: token })).then(function (r) { return r.json(); });
    }
    function apiPost(body) {
      body = Object.assign({}, body, { token: token });
      // Content-Type text/plain evita o preflight de CORS que o Apps Script não trata —
      // não troque para application/json, ou as chamadas passam a falhar no navegador.
      return fetch(baseUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json(); });
    }
    function apiGetTSE() {
      return fetch(montarUrl({ action: 'tse', token: token })).then(function (r) { return r.json(); });
    }
    // Guarda o último JSON de cada parte pra só notificar (e disparar re-render) quando
    // algo realmente mudou — sem isso, cada ciclo de polling (a cada poucos segundos)
    // re-renderiza a página inteira mesmo sem nenhuma mudança real, apagando o que a
    // pessoa estiver digitando nos campos de formulário naquele instante.
    var ultimoJson = { 'config/geral': null, 'historico/pontos': null, oficial: null, candidatosPartido: null, fiscais: null };
    function notificarTodos(snap) {
      latest = snap;
      var chaveConfig = 'config/geral', chaveHistorico = 'historico/pontos';
      var jsonConfig = JSON.stringify(snap.config);
      if (jsonConfig !== ultimoJson[chaveConfig]) {
        ultimoJson[chaveConfig] = jsonConfig;
        (docListeners[chaveConfig] || []).forEach(function (cb) { cb({ exists: !!snap.config, data: function () { return snap.config; } }); });
      }
      var jsonHistorico = JSON.stringify(snap.historico);
      if (jsonHistorico !== ultimoJson[chaveHistorico]) {
        ultimoJson[chaveHistorico] = jsonHistorico;
        (docListeners[chaveHistorico] || []).forEach(function (cb) { cb({ exists: !!snap.historico, data: function () { return snap.historico; } }); });
      }
      ['oficial', 'candidatosPartido', 'fiscais'].forEach(function (nome) {
        var jsonColecao = JSON.stringify(snap[nome]);
        if (jsonColecao === ultimoJson[nome]) return;
        ultimoJson[nome] = jsonColecao;
        var docs = (snap[nome] || []).map(function (d) { return { id: d.id, data: function () { return d.data; } }; });
        (collListeners[nome] || []).forEach(function (cb) { cb({ docs: docs }); });
      });
    }
    function pollAgora() {
      return apiGetSyncAll().then(function (res) {
        if (res && res.error) { mostrarTelaConexao('Não foi possível ler os dados: ' + res.error); return; }
        notificarTodos(res);
      }).catch(function () { /* falha de rede — tenta de novo no próximo ciclo */ });
    }
    function iniciarPolling() {
      if (pollTimer || parada) return;
      pollAgora();
      pollTimer = setInterval(pollAgora, intervalMs);
    }
    iniciarPolling();

    function makeDocHandle(path) {
      return {
        set: function (data) { return apiPost({ action: 'set', path: path, data: data }).then(function (r) { pollAgora(); return r; }); },
        update: function (data) { return apiPost({ action: 'update', path: path, data: data }).then(function (r) { pollAgora(); return r; }); },
        delete: function () { return apiPost({ action: 'delete', path: path }).then(function (r) { pollAgora(); return r; }); },
        onSnapshot: function (cb) {
          docListeners[path] = docListeners[path] || [];
          docListeners[path].push(cb);
          if (path === 'config/geral') cb({ exists: !!latest.config, data: function () { return latest.config; } });
          if (path === 'historico/pontos') cb({ exists: !!latest.historico, data: function () { return latest.historico; } });
          return function () {};
        },
      };
    }
    function makeCollectionHandle(nome) {
      var handle = {
        doc: function (id) { return makeDocHandle(nome + '/' + id); },
        add: function (data) { return apiPost({ action: 'add', path: nome, data: data }).then(function (r) { pollAgora(); return r; }); },
        limit: function () { return handle; },
        onSnapshot: function (cb) {
          collListeners[nome] = collListeners[nome] || [];
          collListeners[nome].push(cb);
          cb({ docs: (latest[nome] || []).map(function (d) { return { id: d.id, data: function () { return d.data; } }; }) });
          return function () {};
        },
      };
      return handle;
    }
    return {
      doc: makeDocHandle,
      collection: makeCollectionHandle,
      buscarTSE: apiGetTSE,
      pararSincronizacao: function () { parada = true; if (pollTimer) clearInterval(pollTimer); pollTimer = null; },
    };
  }

  document.addEventListener('DOMContentLoaded', boot);
  if (document.readyState !== 'loading') boot();
})();
</script>

</body>
</html>
