<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Central de Apuração ES</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗳️</text></svg>">

  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #FFFFFF;
    --panel: #FFFFFF;
    --panel-2: #F5F6F8;
    --ink: #182430;
    --ink-soft: #5C6B7A;
    --ink-faint: #93A0AC;
    --border: #E7E9ED;
    --accent: #FB6C03;
    --accent-2: #019FC6;
    --accent-3: #F6A800;
    --accent-ink: #FFFFFF;
    --accent-soft: #FFE7D4;
    --accent-2-soft: #D6F0F7;
    --accent-3-soft: #FDECC2;
    --navy: #1E4E8C;
    --ok: #21734B;
    --ok-soft: #DEEEE2;
    --warn: #93630D;
    --warn-soft: #F4E7C9;
    --danger: #A63A28;
    --danger-soft: #F5DFD8;
    --shadow: 0 1px 2px rgba(24, 36, 48, 0.06), 0 8px 24px -12px rgba(24, 36, 48, 0.16);
    --focus: #FB6C03;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161D;
      --panel: #1A222B;
      --panel-2: #212B35;
      --ink: #EEF2F6;
      --ink-soft: #A6B2BE;
      --ink-faint: #71808E;
      --border: #2B3540;
      --accent: #FF8A3D;
      --accent-2: #29C2E8;
      --accent-3: #FFC530;
      --accent-ink: #14202A;
      --accent-soft: #3A2412;
      --accent-2-soft: #0F323C;
      --accent-3-soft: #3A2C0A;
      --navy: #8FB6EA;
      --ok: #5FBF8B;
      --ok-soft: #1B3226;
      --warn: #E5B34A;
      --warn-soft: #362909;
      --danger: #E27A61;
      --danger-soft: #3A1E17;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
      --focus: #FF8A3D;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10161D;
    --panel: #1A222B;
    --panel-2: #212B35;
    --ink: #EEF2F6;
    --ink-soft: #A6B2BE;
    --ink-faint: #71808E;
    --border: #2B3540;
    --accent: #FF8A3D;
    --accent-2: #29C2E8;
    --accent-3: #FFC530;
    --accent-ink: #14202A;
    --accent-soft: #3A2412;
    --accent-2-soft: #0F323C;
    --accent-3-soft: #3A2C0A;
    --navy: #8FB6EA;
    --ok: #5FBF8B;
    --ok-soft: #1B3226;
    --warn: #E5B34A;
    --warn-soft: #362909;
    --danger: #E27A61;
    --danger-soft: #3A1E17;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
    --focus: #FF8A3D;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: 'Poppins', ui-sans-serif, sans-serif; font-weight: 600; text-wrap: balance; margin: 0; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-weight: 500; }
  a { color: inherit; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .app { max-width: 1180px; margin: 0 auto; padding: 0 16px 64px; }

  /* Top bar */
  .topbar-rail { height: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-3), var(--accent-2)); }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 0;
  }
  .topbar-inner { max-width: 1180px; margin: 0 auto; }
  .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 11px;
    background:
      linear-gradient(#fff, #fff) padding-box,
      linear-gradient(135deg, var(--accent), var(--accent-3), var(--accent-2)) border-box;
    border: 2px solid transparent;
    color: var(--accent); font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: -0.02em;
    box-shadow: 0 3px 10px -4px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .brand h1 { font-size: 20px; letter-spacing: -0.01em; font-weight: 600; }
  .brand .sub { color: var(--ink-soft); font-size: 12.5px; }
  .status-chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    border: 1px solid var(--border); background: var(--panel);
    white-space: nowrap;
  }
  .status-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .status-chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .status-chip.ok .dot { background: var(--ok); }
  .status-chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .status-chip.warn .dot { background: var(--warn); }
  .status-chip.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .status-chip.danger .dot { background: var(--danger); }
  .status-chip.neutral { color: var(--ink-soft); }
  .status-chip.neutral .dot { background: var(--ink-faint); }

  .tabs { display: flex; gap: 4px; margin-top: 14px; overflow-x: auto; }
  .tab-btn {
    border: none; background: none; padding: 10px 14px; font-size: 13.5px; font-weight: 600;
    color: var(--ink-soft); border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab-btn:hover { color: var(--ink); }

  main { padding-top: 20px; display: flex; flex-direction: column; gap: 16px; }
  .grid { display: grid; gap: 16px; }
  .grid.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  @media (max-width: 760px) { .grid.cols-2, .grid.cols-3 { grid-template-columns: minmax(0, 1fr); } }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 20px; box-shadow: var(--shadow);
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .card-head h2 { font-size: 15.5px; font-weight: 600; }
  .card-head .hint { color: var(--ink-faint); font-size: 12px; overflow-wrap: anywhere; }
  .eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; color: var(--ink-faint); font-weight: 700; margin-bottom: 4px; }

  .metric { display: flex; flex-direction: column; gap: 4px; }
  .metric .value { font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .metric .label { color: var(--ink-soft); font-size: 12.5px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--ink-faint); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr:hover { background: var(--panel-2); }
  td.num, th.num { text-align: right; font-family: 'IBM Plex Mono', monospace; }
  .table-wrap { overflow-x: auto; border-radius: 12px; }
  .table-wrap table { min-width: 480px; }
  .row-highlight { background: var(--accent-2-soft); }
  .row-warn { background: var(--warn-soft); }

  .pill { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.danger { background: var(--danger-soft); color: var(--danger); }
  .pill.neutral { background: var(--panel-2); color: var(--ink-soft); }
  .pill.brand { background: var(--accent-2-soft); color: var(--accent-2); }

  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--ink);
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; min-height: 92px; resize: vertical; }
  .field { margin-bottom: 12px; }
  .field-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .field-row > * { flex: 1; min-width: 140px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 16px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--panel); font-weight: 700; font-size: 13px;
  }
  .btn:hover { border-color: var(--ink-faint); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 12px -4px color-mix(in srgb, var(--accent) 60%, transparent); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.ghost { border-color: transparent; background: none; color: var(--ink-soft); }
  .btn.danger-outline { color: var(--danger); border-color: var(--danger-soft); }
  .btn.small { padding: 5px 11px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .banner {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--accent-soft); border: 1px solid transparent; border-radius: 10px;
    padding: 12px 14px; font-size: 13px; color: var(--ink);
  }
  .banner.warn { background: var(--warn-soft); }
  .banner b { font-weight: 700; }

  .empty { color: var(--ink-faint); font-size: 13px; padding: 20px 4px; text-align: center; }

  .divider { height: 1px; background: var(--border); margin: 6px 0; }

  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--border); }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--ink-soft); }
  .kv .v { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

  footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--ink-faint); font-size: 12px; }

  ::placeholder { color: var(--ink-faint); }

  @media (prefers-reduced-motion: no-preference) {
    .card { transition: box-shadow .15s ease; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  }

  /* ---------------- gráficos ---------------- */
  .chart-card { display: flex; flex-direction: column; gap: 10px; }
  .chart-empty { color: var(--ink-faint); font-size: 13px; padding: 30px 4px; text-align: center; }
  .chart-svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart-svg text { font-family: 'Poppins', sans-serif; fill: var(--ink); }
  .chart-svg .lbl-muted { fill: var(--ink-faint); }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--ink-soft); }
  .chart-legend .item { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend .swatch { width: 9px; height: 9px; border-radius: 3px; flex: none; }

  /* ---------------- alerta de marco ---------------- */
  .banner.alerta {
    background: var(--accent-3-soft); border: 1px solid color-mix(in srgb, var(--accent-3) 40%, transparent);
    font-weight: 600;
  }

  /* ---------------- modo telão ---------------- */
  .telao {
    position: fixed; inset: 0; z-index: 100; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px; text-align: center; gap: 22px;
  }
  .telao .telao-close {
    position: absolute; top: 22px; right: 22px;
  }
  .telao .telao-numero { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: clamp(48px, 9vw, 108px); line-height: 1; color: var(--accent); letter-spacing: -0.02em; }
  .telao .telao-nome { font-size: clamp(22px, 3.4vw, 40px); font-weight: 700; }
  .telao .telao-partido { color: var(--ink-soft); font-size: clamp(14px, 1.6vw, 20px); }
  .telao .telao-chip { font-size: clamp(15px, 1.8vw, 22px); padding: 12px 26px; }
  .telao .telao-metrics { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  .telao .telao-metrics .value { font-family: 'IBM Plex Mono', monospace; font-size: clamp(28px, 4vw, 52px); font-weight: 600; }
  .telao .telao-metrics .label { font-size: 13px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; }
  .telao .telao-meter-wrap { width: min(680px, 90vw); }

  /* ---------------- tela de configuração da conexão (primeira vez) ---------------- */
  .setup-screen {
    position: fixed; inset: 0; z-index: 200; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .setup-card { max-width: 480px; width: 100%; }
  .setup-card .field textarea, .setup-card .field input { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }
</style>
</head>

  /* ---------------- CSV parsing simples ---------------- */
  function parseCsvLine(line) {
    var out = [], cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (inQ) {
        if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') { inQ = false; }
        else cur += c;
      } else {
        if (c === '"') inQ = true;
        else if (c === ',' || c === ';') { out.push(cur); cur = ''; }
        else cur += c;
      }
    }
    out.push(cur);
    return out.map(function (s) { return s.trim(); });
  }

    return isNaN(n) ? 0 : n;

  /* ---------------- núcleo eleitoral ---------------- */
  // partidos: [{nome, votos}] -> distribuição de vagas por QE + sobras (maiores médias, limiar 80% QE, exceção STF 2024 na fase final)
  function calcularDistribuicao(votosValidos, vagas, partidos) {
    var QE = vagas > 0 ? Math.floor(votosValidos / vagas) : 0;
    var estado = partidos.map(function (p) {
      var vagasQP = QE > 0 ? Math.floor(p.votos / QE) : 0;
      return { nome: p.nome, votos: p.votos, vagasQP: vagasQP, vagasSobra: 0 };
    });
    var distribuidas = estado.reduce(function (s, p) { return s + p.vagasQP; }, 0);
    var sobras = Math.max(0, vagas - distribuidas);
    var historico = [];
    var guard = 0;
    while (sobras > 0 && guard < 500) {
      guard++;
      var elegiveis = estado.filter(function (p) { return QE > 0 && p.votos >= 0.8 * QE; });
      var excecao = false;
      if (elegiveis.length === 0) { elegiveis = estado.filter(function(p){ return p.votos > 0; }); excecao = true; }
      if (elegiveis.length === 0) break;
      var melhor = null;
      elegiveis.forEach(function (p) {
        var media = p.votos / (p.vagasQP + p.vagasSobra + 1);
        if (!melhor || media > melhor.media) melhor = { p: p, media: media };
      });
      if (!melhor) break;
      melhor.p.vagasSobra += 1;
      historico.push({ partido: melhor.p.nome, media: melhor.media, excecaoStf: excecao });
      sobras--;
    }
    var resultado = estado.map(function (p) {
      return { nome: p.nome, votos: p.votos, vagasQP: p.vagasQP, vagasSobra: p.vagasSobra, vagasTotal: p.vagasQP + p.vagasSobra };
    }).sort(function (a, b) { return b.vagasTotal - a.vagasTotal || b.votos - a.votos; });
    return { QE: QE, votosValidos: votosValidos, vagas: vagas, resultado: resultado, historico: historico };
  }

  // aplica a cláusula de desempenho individual (10% do QE) dentro da lista de candidatos de UM partido
  function aplicarClausulaDesempenho(candidatosOrdenados, vagasDoPartido, QE) {
    var minimo = QE * 0.1;
    var vagasRestantes = vagasDoPartido;
    return candidatosOrdenados.map(function (c) {
      var passaClausula = QE > 0 ? c.votos >= minimo : false;
      var eleito = false;
      if (vagasRestantes > 0 && passaClausula) { eleito = true; vagasRestantes--; }
      return Object.assign({}, c, { passaClausula: passaClausula, eleito: eleito, minimoNecessario: minimo });
    });
  }

  /* ---------------- simulador "e se" ---------------- */
  // Simulação simplificada: soma os votos adicionais informados ao candidato e ao partido,
  // e distribui o restante dos votos ainda não apurados entre os demais partidos/candidatos
  // proporcionalmente ao que cada um já tem hoje. É uma projeção aproximada, não uma previsão.
  function simularCenario(votosAdicionaisTotais, votosAdicionaisPartido, votosAdicionaisCandidato) {
    votosAdicionaisTotais = Math.max(0, Number(votosAdicionaisTotais) || 0);
    votosAdicionaisPartido = Math.max(0, Number(votosAdicionaisPartido) || 0);
    votosAdicionaisCandidato = Math.max(0, Number(votosAdicionaisCandidato) || 0);

    var vagas = Number(state.config.vagas) || VAGAS_ALES;
    var nomePartido = (state.config.partido || '').trim();
    var votosValidosAtual = votosValidosTotais();
    var simVotosValidos = votosValidosAtual + votosAdicionaisTotais;

    var partidosAtual = state.oficial.map(function (p) { return { nome: p.nome, votos: Number(p.votos) || 0 }; });
    var restante = Math.max(0, votosAdicionaisTotais - votosAdicionaisPartido);
    var somaOutros = partidosAtual.reduce(function (s, p) {
      return s + (p.nome.toLowerCase() === nomePartido.toLowerCase() ? 0 : p.votos);
    }, 0);
    var partidoAtual = partidosAtual.find(function (p) { return p.nome.toLowerCase() === nomePartido.toLowerCase(); });
    var partidoAtualVotos = partidoAtual ? partidoAtual.votos : 0;

    var simPartidos = partidosAtual.map(function (p) {
      var isNosso = p.nome.toLowerCase() === nomePartido.toLowerCase();
      if (isNosso) return { nome: p.nome, votos: partidoAtualVotos + votosAdicionaisPartido };
      var fatia = somaOutros > 0 ? p.votos / somaOutros : 0;
      return { nome: p.nome, votos: p.votos + fatia * restante };
    });
    var simPartidoVotos = partidoAtualVotos + votosAdicionaisPartido;
    var fatorCrescimentoPartido = partidoAtualVotos > 0 ? simPartidoVotos / partidoAtualVotos : 1;

    var dist = calcularDistribuicao(simVotosValidos, vagas, simPartidos);
    var linhaPartido = dist.resultado.find(function (r) { return r.nome.toLowerCase() === nomePartido.toLowerCase(); });
    var vagasDoPartido = linhaPartido ? linhaPartido.vagasTotal : 0;

    var simCandidatos = candidatosDoPartidoOrdenados().map(function (c) {
      var votosAtuais = Number(c.votos) || 0;
      var votosSim = c.ehNosso ? (votosAtuais + votosAdicionaisCandidato) : Math.round(votosAtuais * fatorCrescimentoPartido);
      return Object.assign({}, c, { votos: votosSim });
    }).sort(function (a, b) { return b.votos - a.votos; });
    var comClausula = aplicarClausulaDesempenho(simCandidatos, vagasDoPartido, dist.QE);
    var nosso = comClausula.find(function (c) { return c.ehNosso; });

    return { QE: dist.QE, votosValidos: simVotosValidos, vagasDoPartido: vagasDoPartido, candidatos: comClausula, nosso: nosso };
  }

  function validarBoletim(f) {
